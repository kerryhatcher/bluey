[package]
name         = "bluey-dashboard"
description  = "ESP32-S3 firmware that shows what bluey scanners have heard on a screen and a web page"
edition.workspace      = true
version.workspace      = true
rust-version.workspace = true

[[bin]]
name = "bluey-dashboard"
path = "./src/bin/main.rs"

[dependencies]
bluey-core = { workspace = true }

esp-hal = { version = "~1.2.2", features = ["esp32s3", "log-04", "unstable"] }
esp-rtos = { version = "0.4.0", features = ["embassy", "esp-alloc", "esp-radio", "esp32s3", "log-04"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3", "log-04"] }
esp-alloc = { version = "0.11.0", features = ["esp32s3"] }
esp-radio = { version = "1.0.0-beta.1", features = ["esp-alloc", "esp32s3", "log-04", "unstable", "wifi"] }
esp-backtrace = { version = "0.20.0", features = ["esp32s3", "panic-handler", "println"] }
# The USB port is the serial link to the CLI, and what the logs come out of.
esp-println = { version = "0.18.0", default-features = false, features = ["esp32s3", "log-04", "jtag-serial"] }

log = "0.4.27"
critical-section = "1.2.0"
static_cell = "2.1.1"
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
embassy-sync = "0.8.0"
embassy-futures = "0.1.2"
embassy-net = { version = "0.9.1", features = ["log", "medium-ethernet", "proto-ipv4", "tcp", "udp"] }
embedded-io-async = "0.7.0"

mipidsi = "0.10.0"
embedded-graphics = "0.8.2"
embedded-hal = "1.0.0"
embedded-hal-bus = "0.3.0"
heapless = "0.9.3"
picoserve = { version = "0.20.1", features = ["alloc", "embassy", "log"] }
edge-dhcp = { version = "0.8.0", default-features = false }
edge-captive = { version = "0.8.0", default-features = false }
