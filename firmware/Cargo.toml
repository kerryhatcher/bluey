[package]
name         = "bluey-firmware"
description  = "ESP32-C6 firmware that scans for BLE devices and WiFi access points"
edition.workspace      = true
version.workspace      = true
rust-version.workspace = true

[[bin]]
name = "bluey-firmware"
path = "./src/bin/main.rs"

[dependencies]
bluey-core = { workspace = true }
esp-hal = { version = "~1.2.2", features = ["esp32c6", "log-04", "unstable"] }

esp-rtos = { version = "0.4.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32c6",
  "log-04",
] }

esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32c6", "log-04"] }
log                    = "0.4.27"

bt-hci = "0.9.0"
embassy-futures = "0.1"
embassy-sync = "0.7"
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
esp-alloc = { version = "0.11.0", features = ["esp32c6"] }
esp-backtrace = { version = "0.20.0", features = [
  "esp32c6",
  "panic-handler",
  "println",
] }
esp-println = { version = "0.18.0", features = ["esp32c6", "log-04"] }
esp-radio = { version = "1.0.0-beta.1", features = [
  "ble",
  "esp-alloc",
  "esp32c6",
  "log-04",
  "unstable",
  "wifi",
] }
trouble-host = { version = "0.7.0", features = ["gatt", "scan"] }

critical-section = "1.2.0"
static_cell      = "2.1.1"
