[workspace]
resolver = "3"
members  = ["crates/bluey-core", "crates/bluey-cli", "firmware", "dashboard"]
# The firmware only builds for the ESP32-C6 (run cargo from inside `firmware/`), so a
# plain `cargo build` at the root builds just the host crates.
default-members = ["crates/bluey-core", "crates/bluey-cli"]

[workspace.package]
edition      = "2024"
version      = "0.1.0"
rust-version = "1.95"

[workspace.dependencies]
bluey-core = { path = "crates/bluey-core" }
postcard   = { version = "1", default-features = false, features = ["alloc"] }
serde      = { version = "1", default-features = false, features = ["derive", "alloc"] }

# esp-radio with two small fixes for the 802.15.4 scanner, see vendor/esp-radio/BLUEY-PATCHES.md.
[patch.crates-io]
esp-radio = { path = "vendor/esp-radio" }

# Profiles only take effect in the workspace root. These are for the firmware, which is
# resource-constrained; the host crates just inherit them.
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
